[package]
name = "maya_ristretto"
version = "1.0.1"
edition = "2015"
readme = "README.md"
license = "MIT"
categories = ["cryptography"]
keywords = ["cryptography", "ristretto", "zero-knowledge"]
autobenches = false

[dependencies]
curve25519-dalek = { version = "4", features = [ "rand_core"] }
subtle = "2"
digest = "0.10"
rand = "0.8"
byteorder = "1"
serde = "1"
serde_derive = "1"
failure = "0.1"
hmac = "0.12"
sha2 = { version = "0.10", features = ["compress"] }
hkdf = "0.12"
rand_chacha = "0.3"
zeroize = "1"
rayon = { version = "1.10", optional = true }

[dev-dependencies]
hex = "0.4"
criterion = "0.4"
bincode = "1"

[features]
parallel = ["rayon"]
yoloproofs = []
global_padding = []


[[test]]
name = "pi1"
required-features = ["yoloproofs"]

[[test]]
name = "pi2"
required-features = ["yoloproofs"]

[[test]]
name = "pi3"
required-features = ["yoloproofs"]

[[bench]]
name = "pi1"
harness = false
required-features = ["yoloproofs"]

[[bench]]
name = "pi2"
harness = false
required-features = ["yoloproofs"]

[[bench]]
name = "pi3"
harness = false
required-features = ["yoloproofs"]

[profile.release]
opt-level = 3
lto = "fat"          
codegen-units = 1     
panic = "abort"      

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1




